<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* class */
        .red{
            background-color: black;
            color: azure;
        }
/* id */
        #green{
            color: green;
            background-color: black;
        }

        /* Child Selector  {directly first child}*/
        div > p{
            color: maroon;
            background-color: blue;
        }

        /* Decendant Selector {indirectly} */ 

        div p {
            color: chocolate;
            background-color: aliceblue;
        }

        *{margin: 0%;
        padding: 0;}

a:visited {
    color: yellow;
}
 a:link {
    color: green;
 }
 a:active {
    color: red;
 }
 a:hover {
    color: magenta;
 }
 
    </style>
</head>
