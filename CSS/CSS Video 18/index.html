<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            background-color: blueviolet;
        }

        .box1 {
            color: bisque;
            padding: 10px;
            margin: 25px;
            border: 2px solid blue;
            height: 200px;
            box-sizing: border-box ;
        }

        .box2 {
            color: black;
            color: bisque;
            padding: 10px;
            margin: 25px;
            border: 2px solid black;
            height: 200px;
            box-sizing: border-box ;
        }
    </style>
</head>

<body>
    <div class="box box1"> Hi I'am a Div!</div>
    <div class="box box2"> Hi I'am a Div2</div>
</body>

</html>
