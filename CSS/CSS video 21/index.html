<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Specificity</title>
    <style>
        /* The specificity value is 1 */
        h1 {
            color: red;
        }

        /* The specificity value is 10 */

        h1.yellow {
            color: yellow;
        } 

        /* The specificity value is 1 */
        .cpurple {
            color: purple;
        }


        /* The specificity value is 1 */
        .cred {
            color: red;
        }

        /* attribute selector specificity 10 */
        [data-x=a] {
            background-color: blue;
        }
    </style>
    <div>
        <h1 class="yellow cred cpurple" data-x="a"> About the css specification
        </h1>
    </div>

    </div>
</head>

<body>

</body>

</html>
