<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS sizing</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .box {
            box-sizing: border-box;
            background-color: burlywood;
            margin: 10px;
            border: 2px solid red;
            /* width: 1964px; */
            margin: auto;
            width: 80vw;
            height: 10vh;
        }

        .container {
            box-sizing: border-box;
            background-color: burlywood;
            margin: 10px;
            border: 2px solid red;
            /* width: 1964px; */
            margin: 20px auto;
            width: 80vw;
            /* height: 80vh; */
            min-height: 80vh;
            font-size: 17px;
        }

        html{
            font-size: 12px;
        }
        .container > div{
            font-size:2rem;
            width: 50%;
            border: 2px solid black;
        }

 .container > div > div{
            font-size:2rem;
            width: 50%;
            border: 2px solid black;
        }

        .mycont{
             background-color: brown;
             box-sizing: border-box;
             margin: 10px auto;
             border: 2px solid black;
             color: yellow;
             font-size: 22px;
             width :80vw;

        }
    </style>
</head>

<body>
    <div class="box">This is a box</div>
    <div class="container">
        <div> This is a container and i created this for the dummy response
            <div>hey is this you there tell </div>
        </div>
    </div>

    <div class="mycont"> I am another container</div>
</body>

</html>
