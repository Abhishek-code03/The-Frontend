<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadows and Outlines</title>
    <style>
        .box {
            border: 2px solid black;
            border-radius: 20px;
            padding: 34px;
            box-shadow: 5px 15px 5px #be1212;
        }

        .text-element {
            text-shadow: 2px 2px 4px #7b1a1a;
            outline: 2px solid blue;
            border: 2px solid red;
            outline-offset: 5px;
        }
    </style>
</head>

<body>
    <div class="box">I am a Box</div>
    <p class="text-element">
        Lorem ipsum dolor sit amet, consectetur adipisicing elit. Repellat, corporis sunt beatae quia inventore nisi
        labore dolorem dolorum quas sint earum accusantium? Expedita, doloremque veniam?
    </p>
</body>

</html>
