<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Form asking User's Name, City, Pincode </h1>
    <form action="post">
        <div>
        <label for="Username">Username</label>
        <input type="text" id="Username" placeholder="type username..." autofocus>
    </div>

        <div>
<label for="City">City</label>
<input type="text" id="City" placeholder="type city...">
        </div>
        <div>
            <label for="Pincode">Pincode</label>
            <input type="number" id="Pincode" placeholder="enter pincode...">
        </div>
    
        <div>
            <button type="submit" >Submit</button>
        </div>
    </form>
    
</body>
</html>
