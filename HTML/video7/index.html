<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lets Create a Form</title>
</head>
<body>
    <h1>Form to apply for 4 Month New Job Program</h1>
    <form action="post">
        <div>
        <label for="username">Enter Your Username</label>
        <input type="text"  id="username" name="username" placeholder="Enter your username">
    </div>
<div>
<label for="password">Password</label>
<input id="password" name="password" placeholder="Enter your Password" autofocus >
</div>
<div>
<input type="radio" id="male" name="gender" value="male">
<label for="male">Male</label>
<input type="radio" id="female" name="gender" value="female">
<label for="female">Female</label>
</div>
    </form>

    <div>
        <input type="checkbox" id= "subscribe"
        value="yes">
        <label for="subscribe">subscribe to newsletter</label>
    </div>
<br>
<div>
    <label for="comment">Enter the comment below</label>
    <textarea name="comment" id="comment" rows="5" cols="50"></textarea>
</div>
<div>
    <select name="Fruits" >
        <option value="Apple">Apple</option>
        <option value="Grapes">Grapes</option>
        <option value="Oranges">Oranges</option>
    </select>
</div>
</body>

</html>
